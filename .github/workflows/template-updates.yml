name: template-updates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parse:
    if: github.repository == 'replicatedhq/enterprise-portal-content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/go.mod
          cache-dependency-path: scripts/go.sum
      - name: Parse updates/*.md
        working-directory: scripts
        env:
          UPDATES_DIR: ${{ github.workspace }}/updates
        run: go run .
