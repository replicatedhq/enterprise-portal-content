name: template-updates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Parse updates/*.md
        working-directory: scripts
        env:
          UPDATES_DIR: ${{ github.workspace }}/updates
        run: go run .
